# Go, with gRPC service stubs.
#
# Dependencies resolve through published modules -- google.golang.org/genproto
# for google.api and google.type, buf.build/go/protovalidate for the rules --
# so this needs no --include-imports.
version: v2
# No .proto here carries a `go_package`: the right value depends on where the
# code lands, and api-linter requires java_package but not go_package, so rule
# 1 forbids committing one to close the asymmetry. Managed mode supplies it,
# and a consumer generating into their own tree overrides it the same way.
managed:
  enabled: true
  disable:
    # Every file sets these explicitly and api-linter checks them; managed
    # mode must not overwrite what the linter validated.
    - file_option: java_package
    - file_option: java_outer_classname
    - file_option: java_multiple_files
    # Dependencies keep their own canonical Go import paths. Without this the
    # prefix below is applied to google/api and buf/validate too, producing
    # imports into a gen/go/google/api that this module never generates.
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/the-protobuf-project/vdm/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
