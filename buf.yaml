version: v2
# Published to the BSR as a schema-only module. Consumers depend on it and run
# their own codegen -- nothing is generated here, which is why no file carries
# a go_package. See buf.gen.yaml.
#
# The module is rooted at the repository root, not at protobuf/, so that
# protobuf/ is itself the first package segment: protobuf/covesa/vss/cabin/v1
# resolves to package protobuf.covesa.vss.cabin.v1 and PACKAGE_DIRECTORY_MATCH
# holds without a redundant directory inside it.
modules:
  - path: .
    name: buf.build/the-protobuf-project/vdm
    # build/ holds the exported dependency trees the buffers CLI compiles
    # against, written by scripts/export-protos.sh. They are copies of
    # googleapis, protovalidate and the well-known types, so compiling them
    # here would both duplicate every symbol and drag protoc's own edition
    # files into a module that targets proto3.
    excludes:
      - build
      # modules/ holds the upstream specification checkouts. Neither ships a
      # .proto today, but VSS carries protobuf exporters and a later revision
      # may vendor one -- which would enter this module silently, be linted
      # against rules it was never written for, and be published to the BSR
      # as though this repository wrote it.
      - modules
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
lint:
  # BASIC, not STANDARD, and no exception list.
  #
  # buf and api-linter overlap on API design, and where they overlap they
  # contradict: buf STANDARD wants VehiclesService and GetVehicleResponse
  # wrappers, AIP-131 wants Vehicles returning Vehicle. Rather than except
  # individual rules, the two tools are given non-overlapping jobs. buf BASIC
  # checks structure -- package/directory agreement, one package per
  # directory, import hygiene, casing. api-linter is the sole authority on API
  # design.
  #
  # Every rule in the selected category is enforced. Nothing is excepted.
  use:
    - BASIC
breaking:
  use:
    - FILE
