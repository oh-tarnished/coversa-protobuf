name: Sync

# Proves protobuf/ is exactly what the pinned specification produces.
#
# Its own workflow because it is the repository's central claim -- nothing
# under protobuf/ is written by hand -- and because a stale tree is a
# different failure from a lint error: the fix is to run `just sync` and
# commit, never to edit the file the job is complaining about.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  Sync:
    name: Generated Tree Is Current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # Both generated artefacts: the schema and the Markdown reference beside
      # it. The docs are generated from the same model rather than parsed back
      # out of the protos, so a drift in either shows up here.
      - name: Regenerate
        run: |
          go run ./sync/cmd/sync
          buf format -w
          go run ./sync/cmd/docs

      # A diff here means someone edited an emitted file. The next `just sync`
      # would silently revert it, so it is caught now rather than lost later.
      - name: Check For Drift
        run: |
          git diff --exit-code -- protobuf/ || {
            echo "::error::protobuf/ is stale or was hand-edited."
            echo "Run 'just sync' and commit the result; do not edit generated files."
            exit 1
          }
          echo "protobuf/ matches the pinned specification."
