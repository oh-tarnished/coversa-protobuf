name: Generate

# Generates each language and compiles the result.
#
# Its own workflow because it is a matrix over four toolchains and is by far
# the slowest gate, and because what it proves is distinct from linting: that
# the schema produces code a consumer can actually build. buf lint cannot tell
# you that.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  Generate:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Go
            template: go
          - language: TypeScript
            template: typescript
          - language: Python
            template: python
          - language: Java
            template: java
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Setup Go
        if: matrix.language == 'Go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Setup Node
        if: matrix.language == 'TypeScript'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python
        if: matrix.language == 'Python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Java
        if: matrix.language == 'Java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # TypeScript and Python need --include-imports; their templates in buf/
      # say why. The other languages resolve dependencies through published
      # runtime packages.
      - name: Generate
        run: |
          extra=""
          case "${{ matrix.template }}" in
            typescript|python) extra=--include-imports ;;
          esac
          buf generate --template buf/${{ matrix.template }}.yaml $extra

      # Compile only. Nothing is run, packaged or published.
      # GOWORK=off because gen/go is not a workspace member: go.work names
      # only ./sync, and a build inside a non-member module fails while the
      # workspace is active. See the comment in go.work.
      - name: Build Go
        if: matrix.language == 'Go'
        env:
          GOWORK: "off"
        run: |
          cp sandbox/go/go.mod gen/go/go.mod
          cd gen/go
          GOFLAGS=-mod=mod go mod tidy
          go build ./...

      - name: Build TypeScript
        if: matrix.language == 'TypeScript'
        run: |
          cp sandbox/ts/package.json sandbox/ts/tsconfig.json gen/typescript/
          cd gen/typescript
          npm install --no-fund --no-audit
          npx tsc --noEmit

      - name: Build Python
        if: matrix.language == 'Python'
        run: |
          pip install --quiet -r sandbox/python/requirements.txt
          cd gen/python
          # google.api and google.type come from googleapis-common-protos.
          # Keeping the generated copies would make `google` a regular package
          # at sys.path[0], shadowing the installed one and hiding
          # google.protobuf with it.
          rm -rf google
          find protobuf buf -type d -exec touch {}/__init__.py \;
          # Importing every module exercises the descriptor pool, which is
          # where a bad schema actually fails. Compiling the files would not.
          python - <<'PY'
          import importlib, pathlib, sys
          sys.path.insert(0, ".")
          mods = sorted(
              p.with_suffix("").as_posix().replace("/", ".")
              for p in pathlib.Path("protobuf").rglob("*_pb2.py")
          )
          for m in mods:
              importlib.import_module(m)
          print(f"Imported {len(mods)} generated modules.")
          PY

      - name: Build Java
        if: matrix.language == 'Java'
        run: |
          cp sandbox/java/pom.xml gen/java/pom.xml
          cd gen/java
          mvn --quiet --batch-mode compile
